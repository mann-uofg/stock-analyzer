# Streamlit collects anonymous usage statistics by default. This tool is
# offline-first, so telemetry is switched off and the server binds to the
# loopback interface only - nothing about your research leaves this machine.
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
# Serves ./static at /app/static so the bundled font loads from this machine
# rather than from a font CDN - no external request, and it works offline.
enableStaticServing = true
address = "127.0.0.1"
headless = true
fileWatcherType = "auto"

# Streamlit's own base theme cannot change at runtime, so it is pinned to the
# mode the app opens in - dark. Everything Streamlit does not colour itself is
# painted by views/theme.py, which still supports both modes at runtime.
[theme]
base = "dark"
primaryColor = "#5b9cff"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#141417"
textColor = "#f4f4f7"
font = "sans serif"
