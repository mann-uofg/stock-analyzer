<!DOCTYPE html>
<!--
  Hides the top navigation on the way down and brings it back on the way up.

  This has to be a component rather than a <script> in st.markdown, because
  Streamlit strips scripts from markdown. The frame is same-origin with the app,
  so it reaches the real document and attaches one listener there.

  Two things make this less trivial than it looks. Streamlit scrolls an inner
  element rather than the window, so a listener on `window` never fires. And the
  frame remounts on every script run - which in this app is often - so the
  listener has to be installed exactly once or the handlers pile up until
  scrolling stutters.
-->
<meta charset="utf-8" />
<script>
  function post(type, extra) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*"
    );
  }
  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 0 });

  (function () {
    var doc, win;
    try {
      win = window.parent;
      doc = win.document;
    } catch (err) {
      return; // Cross-origin: leave the nav permanently visible.
    }
    // The remount guard. Without it every rerun adds another listener.
    //
    // Set only once the listener is genuinely attached. Setting it up front
    // was a silent, permanent failure: the first attempt could run before
    // Streamlit had built the scroll container, and the guard then blocked
    // every later attempt from ever trying again.
    if (win.__navScrollBound) return;

    var HIDE_CLASS = "nav-hidden";
    // Far enough down that the nav does not flicker while the page settles,
    // and past the point where it would still be overlapping the page title.
    var ARM_AT = 90;
    // Ignore jitter: a trackpad reports a pixel of movement in both
    // directions and the bar would strobe.
    var DEADZONE = 6;

    var lastY = 0;
    // Throttled on a clock rather than requestAnimationFrame. rAF is the usual
    // choice for scroll work, but browsers pause it whenever the document is
    // not being composited - a background tab, or a pane that is not on screen
    // - and the handler would then never run, leaving the bar stuck in
    // whichever state it was last in. The work here is reading one number and
    // toggling one class, so a plain interval guard is enough and never stops.
    var MIN_GAP_MS = 60;
    var lastRun = 0;

    function scroller() {
      return doc.querySelector('[data-testid="stMain"]') || doc.scrollingElement;
    }

    function apply() {
      var el = scroller();
      var header = doc.querySelector('[data-testid="stHeader"]');
      if (!el || !header) return;

      var y = el.scrollTop;
      var delta = y - lastY;

      // Near the top the bar is always shown, whatever direction the last
      // movement was. Deciding purely on direction left it stuck off-screen
      // after a jump back to the top - which is precisely where it has to be
      // visible - because that jump is one event and the state never reset.
      if (y <= ARM_AT) {
        header.classList.remove(HIDE_CLASS);
        lastY = y;
        return;
      }

      // Below that, direction decides, ignoring jitter too small to be intent.
      if (Math.abs(delta) < DEADZONE) return;
      if (delta > 0) {
        header.classList.add(HIDE_CLASS);
      } else {
        header.classList.remove(HIDE_CLASS);
      }
      lastY = y;
    }

    function onScroll() {
      var now = Date.now();
      if (now - lastRun < MIN_GAP_MS) return;
      lastRun = now;
      apply();
    }

    // Listen on the document in the capture phase rather than on the scroll
    // container itself. Scroll events do not bubble, but they are visible
    // going down, so this catches the container whenever Streamlit gets round
    // to creating it - and keeps working when React later replaces it, which
    // an element-level listener would not survive.
    doc.addEventListener("scroll", onScroll, { capture: true, passive: true });
    win.__navScrollBound = true;

    var initial = scroller();
    if (initial) lastY = initial.scrollTop;
  })();
</script>
